name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go vet ./... && go test ./...
      - run: make wheels
      - name: check the build
        run: |
          VERSION=$(git describe --tags --always)
          cd dist
          sha256sum -c SHA256SUMS
          ./kveritas-linux-amd64 version | grep -F "kveritas $VERSION "
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install --no-index --find-links . kveritas
          /tmp/wheel/bin/kveritas version | grep -F "kveritas $VERSION "
          test "$(ls *.whl | wc -l)" = 5
      # Only a pushed tag publishes; a manual run stops after the checks above.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: 27-GROUP/kveritas-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          path: releases
      - if: startsWith(github.ref, 'refs/tags/')
        name: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')
          cp dist/kveritas-* dist/SHA256SUMS releases/bin/
          rm -f releases/bin/*.whl
          cd releases
          sed -i -E "s#expanded_assets/v[0-9.]+#expanded_assets/$TAG#g" README.md
          sed -i -E "s#^Latest: v[0-9.]+\. .*#Latest: $TAG. $(echo "$NOTES" | head -1 | sed 's/[#&]/\\&/g')#" README.md
          git config user.name "Mamadou2727"
          git config user.email "mamadouk393@gmail.com"
          git add bin README.md
          git commit -m "$TAG"
          git push
          cd ../dist
          gh release create "$TAG" -R 27-GROUP/kveritas-releases --title "$TAG" --notes "$NOTES" \
            kveritas-darwin-amd64 kveritas-darwin-arm64 kveritas-linux-amd64 kveritas-linux-arm64 \
            kveritas-server-darwin-arm64 kveritas-server-linux-amd64 kveritas-windows-amd64.exe SHA256SUMS *.whl
